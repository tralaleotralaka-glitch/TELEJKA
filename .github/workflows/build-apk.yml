name: Build TELEJKA Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish TELEJKA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies & run tests
        run: |
          npm ci
          npm test

      - name: Build web bundle & sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Prepare signing keystore (optional secret)
        id: keystore
        shell: bash
        run: |
          if [ -n "${{ secrets.TELEJKA_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.TELEJKA_KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/telejka-release.jks"
            echo "keystore_file=${{ runner.temp }}/telejka-release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "keystore_file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APKs (Debug & Release)
        working-directory: android
        env:
          TELEJKA_KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore_file }}
          TELEJKA_KEYSTORE_PASSWORD: ${{ secrets.TELEJKA_KEYSTORE_PASSWORD }}
          TELEJKA_KEY_ALIAS: ${{ secrets.TELEJKA_KEY_ALIAS }}
          TELEJKA_KEY_PASSWORD: ${{ secrets.TELEJKA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Collect & verify signed APKs
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/*.apk apk-output/
          cp android/app/build/outputs/apk/release/*.apk apk-output/
          ls -lh apk-output/

          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)"
          if [ -n "$APKSIGNER" ]; then
            for apk in apk-output/*.apk; do
              echo "==> Verifying signature: $apk"
              "$APKSIGNER" verify --print-certs "$apk"
            done
          fi

          (cd apk-output && sha256sum *.apk > SHA256SUMS.txt)
          cat apk-output/SHA256SUMS.txt

      - name: Upload TELEJKA APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TELEJKA-APK
          path: |
            apk-output/*.apk
            apk-output/SHA256SUMS.txt
          retention-days: 30

      - name: Publish APK files to GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          NOTES_FILE="${{ runner.temp }}/release-notes.md"
          cat <<'EOF' > "$NOTES_FILE"
          ## TELEJKA v1.0.0 — Android APK

          Прямые установочные `.apk` файлы приложения **TELEJKA** (Telegram WebView Hub, редактор постов, генератор `t.me`/`tg://` ссылок и QR-кодов, консоль Telegram Bot API).

          ### Установка на Android
          1. Скачайте **`TELEJKA-v1.0.0-release.apk`** ниже (один клик, без распаковки архива).
          2. Откройте файл на Android-устройстве (Android 7.0 / API 24 и выше) и разрешите установку из неизвестных источников при запросе.

          ### Контрольные суммы (SHA-256)
          ```
          EOF
          cat apk-output/SHA256SUMS.txt >> "$NOTES_FILE"
          echo '```' >> "$NOTES_FILE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apk-output/*.apk apk-output/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --target "${{ github.sha }}" --title "TELEJKA v1.0.0 (Android APK)" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" apk-output/*.apk apk-output/SHA256SUMS.txt \
              --target "${{ github.sha }}" \
              --title "TELEJKA v1.0.0 (Android APK)" \
              --notes-file "$NOTES_FILE"
          fi
